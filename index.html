<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Characteristics of Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===================== TOKENS ===================== */
:root{
  --bg:#F4F8F2; --surface:#FFFFFF; --surface2:#EAF2E7; --ink:#1C2B20; --muted:#4A5E50;
  --leaf:#2E7D32; --leaf-strong:#1F5E24; --leaf-soft:#DCEDD8; --on-leaf:#FFFFFF;
  --sun:#F5C518; --on-sun:#1C2B20; --line:#C9D9C5; --ok:#1E7A38; --ok-soft:#DFF3E3;
  --bad:#B3261E; --bad-soft:#FBE3E1; --info:#1D5F8A; --info-soft:#E1EEF7; --water:#CFE6F3; --sky:#EEF6FB;
  --shadow:0 1px 2px rgba(28,43,32,.08),0 4px 14px rgba(28,43,32,.06);
  --fs-body:1.0625rem; --head:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111912; --surface:#1A241C; --surface2:#213025; --ink:#E6F0E7; --muted:#A8BCAC;
    --leaf:#7CC47F; --leaf-strong:#A8DEAA; --leaf-soft:#22392A; --on-leaf:#0E1A10;
    --sun:#F5C518; --on-sun:#1C2B20; --line:#30443A; --ok:#7FD99A; --ok-soft:#1D3626;
    --bad:#FF9A90; --bad-soft:#3D1F1D; --info:#93CBF0; --info-soft:#1B2D3B; --water:#1E3747; --sky:#162530;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#111912; --surface:#1A241C; --surface2:#213025; --ink:#E6F0E7; --muted:#A8BCAC;
    --leaf:#7CC47F; --leaf-strong:#A8DEAA; --leaf-soft:#22392A; --on-leaf:#0E1A10;
    --sun:#F5C518; --on-sun:#1C2B20; --line:#30443A; --ok:#7FD99A; --ok-soft:#1D3626;
    --bad:#FF9A90; --bad-soft:#3D1F1D; --info:#93CBF0; --info-soft:#1B2D3B; --water:#1E3747; --sky:#162530;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
/* ===================== BASE ===================== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-body);line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.1;margin:0 0 .4em;letter-spacing:.01em}
h1{font-size:clamp(1.9rem,4.5vw,2.8rem)} h2{font-size:1.6rem} h3{font-size:1.25rem}
p{margin:0 0 .75em} ul{margin:0 0 .75em;padding-left:1.2em} li{margin:.2em 0}
a{color:var(--info)} b,strong{font-weight:700}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--info);outline-offset:2px;border-radius:6px}
h1[tabindex="-1"]:focus{outline:none}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
/* ===================== TOP BAR ===================== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:700;font-size:1.3rem;color:var(--ink);text-decoration:none;margin-right:auto;min-height:44px}
.brand svg{width:28px;height:28px;color:var(--leaf);flex:none}
@media (max-width:420px){.brand{font-size:1.1rem;white-space:nowrap}}
/* ===================== BUTTONS ===================== */
.btn{font:inherit;font-weight:700;font-size:.95rem;min-height:44px;min-width:44px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--leaf)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.btn.primary:hover{background:var(--leaf-strong);border-color:var(--leaf-strong)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--on-sun)}
.btn.sm{font-size:.88rem;padding:6px 10px}
.btn[aria-pressed="true"]{background:var(--leaf-soft);border-color:var(--leaf);color:var(--ink)}
.btn[aria-pressed="true"]::before{content:"✓ ";}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* ===================== HUB ===================== */
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(2.4rem,7vw,4rem);color:var(--leaf-strong);margin-bottom:.15em}
.hero p{font-size:1.15rem;max-width:44ch;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:18px 0 28px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);color:var(--ink);text-decoration:none;min-height:150px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--leaf)}
.tile .ic{width:44px;height:44px;color:var(--leaf)}
.tile .nm{font-family:var(--head);font-weight:700;font-size:1.25rem;line-height:1.1}
.tile .meta{font-size:.85rem;color:var(--muted);margin-top:auto}
.tile .num{position:absolute;top:12px;right:12px}
.tile.done{border-color:var(--leaf);background:linear-gradient(var(--leaf-soft),var(--surface) 70%)}
.tile .chk{font-size:.85rem;font-weight:700;color:var(--ok)}
.tile.puzzle{border-style:dashed}
.badge{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--sun);color:var(--on-sun);font-family:var(--head);font-weight:700;font-size:1.5rem;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.tile .badge{width:36px;height:36px;font-size:1.2rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 18px;box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--info)}
details.teacher table{border-collapse:collapse;width:100%;font-size:.92rem}
details.teacher td,details.teacher th{border-top:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tablewrap{overflow-x:auto}
/* ===================== STATION ===================== */
.st-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 0 10px}
.st-head .badge{width:56px;height:56px;font-size:2rem}
.st-head h1{margin:0;flex:1 1 300px;font-size:clamp(1.7rem,4.5vw,2.5rem)}
.tag{display:inline-flex;align-items:center;min-height:32px;padding:4px 12px;border-radius:999px;background:var(--info-soft);color:var(--info);font-weight:700;font-size:.9rem;border:1px solid var(--info)}
.bigidea{margin:6px 0 20px;padding:16px 18px 16px 20px;border-left:8px solid var(--leaf);background:var(--leaf-soft);border-radius:0 14px 14px 0;font-size:1.25rem;font-weight:700;line-height:1.4}
.sec{margin:0 0 26px}
.sec>h2{display:flex;align-items:center;gap:10px;color:var(--leaf-strong);border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.sec>h2 svg{width:26px;height:26px;color:var(--leaf)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.box h3{color:var(--leaf-strong)}
.dyk{background:var(--info-soft);border:1px solid var(--info);border-radius:12px;padding:12px 14px;font-size:.98rem}
.dyk b:first-child{color:var(--info)}
.sub{font-family:var(--head);font-size:1.35rem;margin:18px 0 8px}
.lead{color:var(--muted)}
.st-foot{border-top:2px solid var(--line);padding:16px 0 40px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.st-foot .row{gap:8px}
.actprog{font-size:.9rem;color:var(--muted);width:100%}
/* ===================== PLAYER ===================== */
.player{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.player .stage{background:var(--sky);position:relative}
.player .stage svg{display:block;width:100%;height:auto}
.player .cap{padding:12px 14px 4px;min-height:4.2em;font-size:1.02rem}
.player .stepn{display:inline-block;font-size:.8rem;font-weight:700;color:var(--muted);margin-right:6px}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px 12px}
.ctrls .speed{display:flex;gap:4px}
.ctrls .speed .btn[aria-pressed="true"]::before{content:""}
.scrub{flex:1 1 140px;min-width:120px;height:44px;accent-color:var(--leaf)}
.extras{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.rmnote{font-size:.85rem;color:var(--muted);padding:0 14px 8px}
svg text{font-family:var(--body)}
.svgink{fill:var(--ink)} .svgmuted{fill:var(--muted)}
/* ===================== TABS ===================== */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs [role=tab][aria-selected="true"]{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
/* ===================== SORTER / DND ===================== */
.sorter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
.hint{font-size:.9rem;color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin-bottom:12px}
.chip{font:inherit;font-size:.95rem;min-height:44px;padding:8px 12px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;line-height:1.25}
.chip.sel{background:var(--sun);color:var(--on-sun);border-color:var(--on-sun);box-shadow:0 0 0 3px var(--sun)}
.chip.dragging{position:relative;z-index:50;cursor:grabbing;box-shadow:0 8px 20px rgba(0,0,0,.25);pointer-events:none}
.chip.ok{border-color:var(--ok);background:var(--ok-soft);cursor:default;pointer-events:none}
.chip.ok::before{content:"✓ ";color:var(--ok);font-weight:700}
.chip:disabled{opacity:1;color:var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bin{border:2px solid var(--line);border-radius:12px;padding:10px;min-height:120px;background:var(--surface2);cursor:pointer}
.bin h4{margin:0 0 8px;font-family:var(--head);font-size:1.2rem}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
.bin.armed,[data-drop].armed{border-color:var(--sun);border-style:dashed}
[data-drop].over{border-color:var(--leaf);background:var(--leaf-soft)}
.fb{min-height:1.6em;margin:10px 0 6px;font-weight:700}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb span{font-weight:400;color:var(--ink)}
.venn{position:relative}
.venn .bin:nth-child(1){border-radius:60px 12px 12px 60px}
.venn .bin:nth-child(3){border-radius:12px 60px 60px 12px}
.venn .bin:nth-child(2){border-color:var(--leaf);border-style:solid}
.slots{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;min-height:56px;background:var(--surface2);cursor:pointer}
.slot .lbl{font-weight:700;min-width:5.5em;font-size:.92rem}
.slot .in{flex:1;display:flex}
.slot.filled{border-color:var(--ok);background:var(--ok-soft)}
.slot .gl{width:34px;height:34px;flex:none;color:var(--leaf);opacity:0}
.slot.filled .gl{opacity:1;animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
/* ladder curved layout on wide screens */
.ladder{position:relative}
.ladder svg.path{display:none}
@media (min-width:760px){
  .ladder{height:520px}
  .ladder svg.path{display:block;position:absolute;inset:0;width:100%;height:100%}
  .ladder .slot{position:absolute;width:30%;transform:translate(-50%,-50%)}
}
/* ===================== QUIZ ===================== */
.quiz{display:grid;gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.q .qt{font-weight:700}
.opts{display:grid;gap:6px}
.opt{font:inherit;text-align:left;min-height:44px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--leaf)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok::before{content:"✓ ";font-weight:700;color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad::before{content:"✗ ";font-weight:700;color:var(--bad)}
.opt:disabled{cursor:default}
.mf .opts{grid-template-columns:1fr 1fr}
/* ===================== MISC WIDGETS ===================== */
.slider{width:100%;height:44px;accent-color:var(--leaf)}
.ticks{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);gap:4px}
.ticks span{flex:1;text-align:center}
.panel2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.stat{font-family:var(--head);font-size:2rem;font-weight:700;line-height:1}
.statl{font-size:.85rem;color:var(--muted)}
.log{font-size:.9rem;max-height:220px;overflow:auto;padding-left:1.1em;margin:0}
.log li{margin:.3em 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.seq{display:flex;flex-wrap:wrap;gap:3px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
.seq span{display:inline-grid;place-items:center;width:28px;height:30px;border-radius:5px;font-size:.95rem;border:2px solid transparent}
.seq span.diff{border-color:var(--ink);text-decoration:underline}
.bA{background:#7FCB6A;color:#10260A} .bT{background:#4DC2C2;color:#0A2626} .bG{background:#E46BB5;color:#2A0A1E} .bC{background:#F3D34A;color:#2A220A}
.pair-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.pair-row .base{width:44px;height:44px;display:grid;place-items:center;border-radius:8px;font-weight:700;font-size:1.1rem}
.pair-row .rung{width:40px;height:6px;background:var(--line);border-radius:3px;transform-origin:left}
.pair-row.done .rung{background:var(--ok);animation:zip .35s ease-out}
@keyframes zip{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gauges{display:grid;gap:10px}
.gauge .gl{display:flex;justify-content:space-between;font-size:.92rem;gap:8px}
.gauge .gv{font-weight:700}
.gauge .track{position:relative;height:16px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.gauge .band{position:absolute;top:0;bottom:0;background:var(--ok-soft);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px}
.gauge.out .gv{color:var(--bad)}
.alert{min-height:2.4em;padding:8px 12px;border-radius:10px;background:var(--bad-soft);color:var(--ink);font-weight:700}
.alert.calm{background:var(--ok-soft)}
.ctl{display:grid;gap:4px;margin-bottom:8px}
.ctl label{font-weight:700;font-size:.95rem}
.coins{display:flex;flex-wrap:wrap;gap:4px;min-height:30px}
.coin{width:26px;height:26px;border-radius:50%;background:var(--sun);color:var(--on-sun);display:grid;place-items:center;font-size:.55rem;font-weight:700;border:2px solid #B88E00}
.light{display:grid;place-items:center;gap:10px;width:100%;min-height:260px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;font:inherit;color:var(--ink);padding:14px;touch-action:manipulation}
.light .msg{font-family:var(--head);font-size:1.8rem;font-weight:700}
.big-avg{font-family:var(--head);font-size:3rem;font-weight:700;color:var(--leaf-strong);line-height:1}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.gtile{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:6px}
.gtile svg{width:100%;height:110px;background:var(--sky);border-radius:8px}
.gtile.done{border-color:var(--ok)}
.gtile .opt{font-size:.88rem;padding:6px 8px}
/* puzzle */
.pz-word{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pz-word.solved{border-color:var(--ok);background:var(--ok-soft)}
.pz-scr{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.25em;color:var(--muted)}
.pz-boxes{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.pz-cell{position:relative}
.pz-cell input{width:40px;height:46px;text-align:center;font:inherit;font-weight:700;font-size:1.25rem;text-transform:uppercase;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);padding:0}
.pz-cell .n{position:absolute;top:1px;left:3px;font-size:.62rem;font-weight:700;color:var(--muted);pointer-events:none}
.pz-cell input.ok{border-color:var(--ok);background:var(--ok-soft)}
.pz-cell input.bad{border-color:var(--bad);background:var(--bad-soft)}
.pz-cell input.hinted{border-style:dashed}
.quote{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:700;font-size:1.15rem;align-items:flex-end}
.qw{display:flex;gap:2px;align-items:flex-end}
.qc{display:flex;flex-direction:column;align-items:center;width:26px}
.qc .l{height:30px;line-height:30px;border-bottom:2px solid var(--ink);width:100%;text-align:center}
.qc.given .l{color:var(--leaf-strong)}
.qc .n{font-size:.62rem;color:var(--muted);font-weight:700}
.qc.fill .l{animation:pop .35s}
.qpunct{align-self:flex-end;padding-bottom:16px}
.flyer{position:fixed;z-index:80;font-weight:700;font-size:1.3rem;color:var(--on-sun);background:var(--sun);border-radius:6px;width:28px;height:30px;display:grid;place-items:center;pointer-events:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px}
/* free response, challenge, report */
.fr{margin-bottom:14px}.fr label{display:block;margin-bottom:6px}
.ta,.inp{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.ta{min-height:110px;resize:vertical;line-height:1.5}.inp{min-height:44px}.ta:focus,.inp:focus{border-color:var(--leaf);outline:none;box-shadow:0 0 0 3px var(--leaf-soft)}
.frfb{font-size:.92rem;margin:6px 0 0;color:var(--muted)}.frfb b{color:var(--ink)}
.xp{height:14px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:8px}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--sun));transition:width .5s}
.climb{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px;position:relative}
.climb li{display:flex}.climb li:nth-child(odd){justify-content:flex-end}
.climb .btn{width:min(100%,420px);display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:0 12px;text-align:left;justify-items:start;padding:10px 14px}
.lvn{grid-row:1/3;align-self:center;font-family:var(--head);font-size:1.1rem;background:var(--sun);color:var(--on-sun);border-radius:8px;padding:4px 8px}
.lvt{font-family:var(--head);font-size:1.25rem}.lvd{font-weight:400;font-size:.85rem;color:var(--muted)}.lvs{grid-row:1/3;grid-column:3;align-self:center;color:#B88E00;font-size:1rem}
.climb li.cur .btn{border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}.climb li.done .btn{background:var(--ok-soft);border-color:var(--ok)}.climb li.locked .btn{opacity:.6}
.stage9{border:2px solid var(--leaf)}.itm{display:flex;gap:14px;align-items:center;margin:6px 0 12px}.itm-ic{font-size:3rem;line-height:1;width:72px;height:72px;display:grid;place-items:center;background:var(--surface2);border-radius:50%;flex:none}
/* glossary drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:2px solid var(--line);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;flex:1}
.drawer .body{overflow:auto;padding:12px 16px}
.drawer input[type=search]{width:100%;min-height:44px;font:inherit;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:10px}
.gl-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.gl-item svg{width:22px;height:22px;flex:none;color:var(--leaf);margin-top:2px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
.alive-items{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.alive-items .btn[aria-selected="true"]{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin:10px 0}
.checks .btn{justify-content:flex-start;text-align:left}
.verdict li.yes::marker{content:"✓  "} .verdict li.no::marker{content:"✗  "}
.mice-wrap svg{background:#E9D9B0}
/* gallery loops */
@media (prefers-reduced-motion:no-preference){
  .g-bend{animation:bend 3s ease-in-out infinite alternate;transform-origin:60px 100px;transform-box:view-box}
  .g-pupil{animation:pupil 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  .g-roll{animation:roll 3s ease-in-out infinite}
  .g-shiver{animation:shiv .15s linear infinite}
  .g-jawT{animation:jawT 3s ease-in-out infinite;transform-origin:100px 70px;transform-box:view-box}
  .g-jawB{animation:jawB 3s ease-in-out infinite;transform-origin:100px 70px;transform-box:view-box}
  .heart{animation:beat var(--beat,.85s) ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  .glow{animation:glow 1.4s ease-in-out infinite alternate}
}
@keyframes bend{from{transform:rotate(0)}to{transform:rotate(22deg)}}
@keyframes pupil{0%,30%{transform:scale(1)}70%,100%{transform:scale(.35)}}
@keyframes roll{0%,30%{transform:scaleX(1)}60%,90%{transform:scaleX(.55)}100%{transform:scaleX(1)}}
@keyframes shiv{0%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}100%{transform:translateX(-1.5px)}}
@keyframes jawT{0%,40%{transform:rotate(-28deg)}60%,100%{transform:rotate(0)}}
@keyframes jawB{0%,40%{transform:rotate(28deg)}60%,100%{transform:rotate(0)}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}}
@keyframes glow{from{stroke:#E0A800}to{stroke:#FFE36E}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media (max-width:520px){.st-head .badge{width:46px;height:46px;font-size:1.6rem}.bigidea{font-size:1.1rem}.pz-cell input{width:34px;height:42px;font-size:1.1rem}.qc{width:21px}.quote{font-size:1rem}}

<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#hub"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 29V15" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M16 17C9 17 5 12 5 5c7 0 11 4 11 12zM16 14c0-6 4-10 11-10 0 6-4 10-11 10z" fill="currentColor"/></svg>Characteristics of Life</a>
  <button class="btn" type="button" id="gloBtn" aria-controls="drawer" aria-expanded="false">Glossary</button>
</div></header>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Glossary"><header><h2>Glossary</h2><button class="btn" type="button" id="gloClose">Close</button></header><div class="body"><label class="sr" for="gloQ">Search the glossary</label><input type="search" id="gloQ" placeholder="Search a word"><div id="gloList"></div></div></aside>
<script>
"use strict";
/* =========================================================
   CORE UTILITIES
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;};
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const op=(el,v)=>{if(el)el.style.opacity=v;};
const tr=(el,s)=>{if(el)el.setAttribute('transform',s);};
const at=(el,o)=>{if(el)for(const k in o)el.setAttribute(k,o[k]);};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200);}

/* =========================================================
   PROGRESS STORE (memory + localStorage mirror)
   ========================================================= */
const Store={
  key:'col-progress-v1', d:{visited:{},done:{},acts:{},fr:{},data:{},qc:{},alive:{}},
  load(){try{const s=localStorage.getItem(this.key);if(s){const p=JSON.parse(s);this.d={visited:p.visited||{},done:p.done||{},acts:p.acts||{},fr:p.fr||{},data:p.data||{},qc:p.qc||{},alive:p.alive||{}};}}catch(e){}},
  save(){try{localStorage.setItem(this.key,JSON.stringify(this.d));}catch(e){} refreshProgressUI();},
  visit(n){if(!this.d.visited[n]){this.d.visited[n]=1;this.save();}},
  act(id){if(!this.d.acts[id]){this.d.acts[id]=1;this.save();toast('Activity finished ✓');}},
  setDone(n,v){if(v)this.d.done[n]=1;else delete this.d.done[n];this.save();},
  quiet(){try{localStorage.setItem(this.key,JSON.stringify(this.d));}catch(e){}},
  put(k,v){this.d.data[k]=v;this.quiet();},
  reset(){this.d={visited:{},done:{},acts:{},fr:{},data:{},qc:{},alive:{}};try{localStorage.removeItem(this.key);}catch(e){} this.save();}
};

/* =========================================================
   ANIMATION PLAYER  (render(t) is a pure function of time,
   so Play / Pause / Restart / Step / speed / scrub all work)
   ========================================================= */
const Players=new Set(); let rafOn=false,lastTs=0;
function tick(ts){const dt=lastTs?Math.min(.05,(ts-lastTs)/1000):0;lastTs=ts;let any=false;
  Players.forEach(p=>{if(p.playing&&p.visible){any=true;p.advance(dt);}});
  if(any)requestAnimationFrame(tick);else{rafOn=false;lastTs=0;}}
function kick(){if(!rafOn){rafOn=true;lastTs=0;requestAnimationFrame(tick);}}
const visIO=new IntersectionObserver(es=>es.forEach(e=>{const p=e.target._player;if(!p)return;p.visible=e.isIntersecting;
  if(p.visible){if(p.autoplay&&!p.started&&!RM)p.play();kick();}}),{threshold:.2});

function Player(host,o){
  const el=h(`<figure class="player" style="margin:0 0 18px">
    <div class="stage">${o.svg}</div>
    <figcaption class="cap" aria-live="polite"></figcaption>
    ${RM?'<p class="rmnote">Reduced motion is on, so this starts paused. Use <b>Step</b> to move through it.</p>':''}
    <div class="ctrls" role="group" aria-label="Animation controls">
      <button class="btn primary pp" type="button" aria-label="Play">▶ Play</button>
      <button class="btn rs" type="button">↺ Restart</button>
      <button class="btn st" type="button">Step ⏭</button>
      <span class="speed" role="group" aria-label="Speed">${[.5,1,2].map(s=>`<button class="btn sm sp" type="button" data-s="${s}" aria-pressed="${s===1}">${s}×</button>`).join('')}</span>
      <input class="scrub" type="range" min="0" max="1000" value="0" aria-label="Move through the animation">
    </div>${o.extras?`<div class="extras">${o.extras}</div>`:''}</figure>`);
  host.appendChild(el);
  const svg=el.querySelector('svg'), cap=el.querySelector('.cap'), pp=el.querySelector('.pp'), scrub=el.querySelector('.scrub');
  const cache={};
  const P={el,svg,o,t:0,speed:1,playing:false,visible:false,started:false,autoplay:o.autoplay!==false,
    k:key=>cache[key]||(cache[key]=svg.querySelector(`[data-k="${key}"]`))};
  const steps=()=>typeof o.steps==='function'?o.steps():(o.steps||[]);
  P.set=t=>{P.t=clamp(t,0,o.duration);o.render(P.t,P);scrub.value=Math.round(P.t/o.duration*1000);
    const st=steps();let c='',idx=0;st.forEach((s,i)=>{if(P.t>=s[0]-1e-6){c=s[1];idx=i;}});
    const html=st.length?`<span class="stepn">Step ${idx+1} of ${st.length}</span>${c}`:'';
    if(html!==P.capHTML){P.capHTML=html;cap.innerHTML=html;}};
  P.advance=dt=>{let t=P.t+dt*P.speed;if(t>=o.duration){if(o.loop)t%=o.duration;else{t=o.duration;P.set(t);P.pause();return;}}P.set(t);};
  P.play=()=>{if(P.t>=o.duration-1e-3&&!o.loop)P.set(0);P.playing=true;P.started=true;pp.textContent='⏸ Pause';pp.setAttribute('aria-label','Pause');kick();};
  P.pause=()=>{P.playing=false;pp.textContent='▶ Play';pp.setAttribute('aria-label','Play');};
  pp.onclick=()=>P.playing?P.pause():P.play();
  el.querySelector('.rs').onclick=()=>{P.set(0);if(!RM)P.play();};
  // Step: jump to the END state of the current step (or of the next one), so each press shows a finished action
  const stepEnd=(st,i)=>o.stepEnd?Math.min(o.stepEnd(i),o.duration):(st[i+1]?st[i+1][0]-0.05:o.duration);
  el.querySelector('.st').onclick=()=>{P.pause();P.started=true;const st=steps();if(!st.length)return;
    if(P.t>=o.duration-0.06){P.set(0);return;}
    let c=0;st.forEach((s,i)=>{if(P.t>=s[0]-1e-6)c=i;});
    const e=stepEnd(st,c);P.set(P.t<e-0.1?e:stepEnd(st,Math.min(c+1,st.length-1)));};
  el.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{P.speed=+b.dataset.s;el.querySelectorAll('.sp').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  scrub.oninput=()=>{P.pause();P.started=true;P.set(scrub.value/1000*o.duration);};
  el._player=P;visIO.observe(el);Players.add(P);
  if(o.init)o.init(P);
  P.set(0);return P;
}

/* =========================================================
   DRAG-AND-DROP SORTER (pointer drag + tap/click/keyboard)
   layout HTML must contain elements with data-drop="binId"
   (each may hold an element .in where correct chips go)
   ========================================================= */
function makeSort(host,o){
  const el=h(`<div class="sorter">${o.title?`<h3 class="sub" style="margin-top:0">${o.title}</h3>`:''}${o.intro?`<p>${o.intro}</p>`:''}
    <p class="hint">Drag each card to where it belongs. Or tap a card (it turns yellow), then tap a box. Keyboard: Tab to a card, press Enter, then Tab to a box and press Enter.</p>
    <div class="pool" aria-label="Cards to place"></div>${o.layout}
    <p class="fb" aria-live="polite"></p><button class="btn sm again" type="button">Start over</button></div>`);
  host.appendChild(el);
  const pool=el.querySelector('.pool'), fb=el.querySelector('.fb');
  let sel=null,left=0,drag=null,suppress=false;
  const targets=()=>$$('[data-drop]',el);
  targets().forEach(t=>{if(t.tagName!=='BUTTON'){t.tabIndex=0;t.setAttribute('role','button');}
    if(!t.getAttribute('aria-label'))t.setAttribute('aria-label','Place card in: '+(t.dataset.name||t.dataset.drop));
    t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t.click();}});});
  function build(){pool.innerHTML='';targets().forEach(t=>{const i=t.querySelector('.in');if(i)i.innerHTML='';t.classList.remove('filled');});
    (o.shuffle===false?o.items.map((x,i)=>i):shuffle(o.items.map((x,i)=>i))).forEach(i=>{
      pool.appendChild(h(`<button type="button" class="chip" data-i="${i}">${o.items[i].t}</button>`));});
    left=o.items.length;fb.textContent='';fb.className='fb';sel=null;arm(false);}
  function arm(on){targets().forEach(t=>t.classList.toggle('armed',on&&!t.classList.contains('filled')));}
  function place(chip,t){const it=o.items[chip.dataset.i];
    if(t.dataset.drop===it.bin && !(o.single&&t.classList.contains('filled'))){
      (t.querySelector('.in')||t).appendChild(chip);chip.setAttribute('aria-disabled','true');chip.tabIndex=-1;chip.classList.add('ok');chip.classList.remove('sel');
      if(o.single)t.classList.add('filled');
      fb.className='fb ok';fb.innerHTML=`✓ Correct. <span>${it.why||''}</span>`;left--;o.onCorrect&&o.onCorrect(it,t);
      if(!left){fb.innerHTML=`✓ All done! <span>${o.done||'Nice work.'}</span>`;o.id&&Store.act(o.id);}
    }else{chip.classList.remove('shake');void chip.offsetWidth;chip.classList.add('shake');
      fb.className='fb bad';fb.innerHTML=`✗ Not there. <span>${it.hint||o.hint||'Reread the key ideas and try another box.'}</span>`;}
    sel&&sel.classList.remove('sel');sel=null;arm(false);}
  el.addEventListener('pointerdown',e=>{const c=e.target.closest('.chip');if(!c||c.classList.contains('ok')||e.button>0)return;
    drag={c,x:e.clientX,y:e.clientY,on:false,id:e.pointerId};try{c.setPointerCapture(e.pointerId);}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.on&&Math.hypot(dx,dy)>8){drag.on=true;drag.c.classList.add('dragging');}
    if(drag.on){drag.c.style.transform=`translate(${dx}px,${dy}px)`;
      const u=document.elementFromPoint(e.clientX,e.clientY),t=u&&u.closest('[data-drop]');
      targets().forEach(x=>x.classList.toggle('over',x===t));}});
  const end=e=>{if(!drag)return;const c=drag.c;
    if(drag.on){c.style.transform='';c.classList.remove('dragging');targets().forEach(x=>x.classList.remove('over'));
      const u=document.elementFromPoint(e.clientX,e.clientY),t=u&&u.closest('[data-drop]');
      if(t&&el.contains(t))place(c,t);suppress=true;setTimeout(()=>suppress=false,50);}
    drag=null;};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',e=>{if(drag){drag.c.style.transform='';drag.c.classList.remove('dragging');drag=null;}});
  el.addEventListener('click',e=>{if(suppress)return;const c=e.target.closest('.chip');
    if(c&&!c.classList.contains('ok')){if(sel===c){c.classList.remove('sel');sel=null;arm(false);}else{sel&&sel.classList.remove('sel');sel=c;c.classList.add('sel');arm(true);}return;}
    const t=e.target.closest('[data-drop]');if(t&&sel)place(sel,t);});
  el.querySelector('.again').onclick=build;build();return el;
}
const binsHTML=(bins,cls='bins')=>`<div class="${cls}">${bins.map(b=>`<div class="bin" data-drop="${b.id}" data-name="${b.label}"><h4>${b.label}</h4>${b.sub?`<p class="hint" style="margin:-4px 0 6px">${b.sub}</p>`:''}<div class="in"></div></div>`).join('')}</div>`;
const slotsHTML=(slots)=>`<div class="slots">${slots.map(s=>`<div class="slot" data-drop="${s.id}" data-name="${s.label}"><span class="lbl">${s.label}</span><div class="in"></div></div>`).join('')}</div>`;

/* =========================================================
   QUICK CHECK QUIZ (instant explanatory feedback)
   q: {q, o:[options], a:index, why, x:{index:explanation}}
   ========================================================= */
function makeQuiz(host,qs,id,cls=''){
  const el=h(`<div class="quiz ${cls}"></div>`);host.appendChild(el);let right=0;const first={};
  const rec=()=>{if(!id)return;const v=Object.values(first);Store.d.qc[id]={r:v.filter(Boolean).length,a:v.length,n:qs.length};Store.quiet();};
  qs.forEach((q,qi)=>{const box=h(`<div class="q"><p class="qt">${qs.length>1?(qi+1)+'. ':''}${q.q}</p><div class="opts" role="group"></div><p class="fb" aria-live="polite"></p></div>`);
    const opts=box.querySelector('.opts'),fb=box.querySelector('.fb');
    q.o.forEach((t,i)=>{const b=h(`<button type="button" class="opt">${t}</button>`);opts.appendChild(b);
      b.onclick=()=>{if(first[qi]===undefined){first[qi]=i===q.a;rec();}if(i===q.a){b.classList.add('ok');$$('.opt',opts).forEach(x=>x.disabled=true);fb.className='fb ok';fb.innerHTML=`✓ Yes! <span>${q.why}</span>`;
          right++;if(right===qs.length&&id)Store.act(id);q.onRight&&q.onRight();}
        else{b.classList.add('bad');b.disabled=true;fb.className='fb bad';fb.innerHTML=`✗ Not quite. <span>${(q.x&&q.x[i])||'Look back at the key ideas and try again.'}</span>`;}};});
    el.appendChild(box);});
  return el;
}

/* =========================================================
   ZOOM ENGINE (used by Station 3 and Station 4)
   frames: [{g:svg-inner, name, cap, scale}]
   ========================================================= */
function makeZoom(host,frames,opts={}){
  const per=3.2, n=frames.length;
  let order=frames.map((f,i)=>i), zoomIn=true;
  const svg=`<svg viewBox="0 0 640 340" role="img" aria-labelledby="${opts.id}-t"><title id="${opts.id}-t">${opts.title}</title>
    <rect width="640" height="340" fill="var(--sky)"/>
    ${frames.map((f,i)=>`<g data-k="f${i}" style="opacity:0"><g>${f.g}</g></g>`).join('')}
    <rect x="10" y="10" width="300" height="40" rx="8" fill="var(--surface)" stroke="var(--line)"/>
    <text x="22" y="37" font-size="20" font-weight="700" class="svgink" data-k="lvl"></text>
    ${opts.scaleBar?`<g transform="translate(470,306)"><rect x="-8" y="-24" width="166" height="40" rx="8" fill="var(--surface)" stroke="var(--line)"/><line x1="0" y1="6" x2="70" y2="6" stroke="var(--ink)" stroke-width="4"/><line x1="0" y1="0" x2="0" y2="12" stroke="var(--ink)" stroke-width="3"/><line x1="70" y1="0" x2="70" y2="12" stroke="var(--ink)" stroke-width="3"/><text x="78" y="11" font-size="15" class="svgink" data-k="sb"></text><text x="0" y="-8" font-size="11" class="svgmuted">scale bar</text></g>`:''}
  </svg>`;
  const P=Player(host,{svg,duration:per*n-1,autoplay:opts.autoplay,extras:opts.extras,
    steps:()=>order.map((fi,i)=>[i*per,frames[fi].cap]),stepEnd:i=>i*per+per-1.05,
    render(t,P){const i=clamp(Math.floor(t/per),0,n-1), local=t-i*per, tp=ease(seg(local,per-1,per));
      frames.forEach((f,fi)=>op(P.k('f'+fi),0));
      const cur=order[i], nxt=i<n-1?order[i+1]:null, gc=P.k('f'+cur), C='320 175';
      const s1=zoomIn?lerp(1,5,tp):lerp(1,.2,tp);
      op(gc,1-tp);gc.firstElementChild.setAttribute('transform',`translate(320 175) scale(${s1}) translate(-320 -175)`);
      if(nxt!==null&&tp>0){const gn=P.k('f'+nxt);op(gn,tp);const s2=zoomIn?lerp(.2,1,tp):lerp(5,1,tp);
        gn.firstElementChild.setAttribute('transform',`translate(320 175) scale(${s2}) translate(-320 -175)`);}
      const show=tp>.5&&nxt!==null?nxt:cur;
      P.k('lvl').textContent=frames[show].name; if(opts.scaleBar)P.k('sb').textContent=frames[show].scale||'';}
  });
  P.setOrder=(rev)=>{zoomIn=!rev;order=frames.map((f,i)=>i);if(rev)order.reverse();P.set(0);};
  return P;
}

/* =========================================================
   ICONS (one consistent line style)
   ========================================================= */
const I=(d)=>`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON={
 1:I('<path d="M16 28V14"/><path d="M16 16c-6 0-9-4-9-9 6 0 9 3 9 9zM16 13c0-5 3-8 9-8 0 5-3 8-9 8z"/><path d="M8 28h16"/>'),
 2:I('<circle cx="10" cy="16" r="6"/><circle cx="22" cy="16" r="6"/><path d="M16 9v14" stroke-dasharray="2 3"/>'),
 3:I('<rect x="6" y="5" width="20" height="6" rx="2"/><rect x="8" y="13" width="16" height="6" rx="2"/><rect x="10" y="21" width="12" height="6" rx="2"/>'),
 4:I('<path d="M10 4c0 6 12 6 12 12s-12 6-12 12"/><path d="M22 4c0 6-12 6-12 12s12 6 12 12"/><path d="M12 9h8M12 23h8M14 16h4"/>'),

  const person=i=>{const H=LS[i][2]*1.15,ratio=[3.8,4.8,6,7,7.5,7.5][i],r=H/ratio/2,top=236-H,hip=236-H*.47,w=[22,24,22,28,32,32][i];

  const ex=S.explore;ex.append(h('<h3 class="sub">Human life-span slider</h3>'));

/* =========================================================

BUILD[2]=root=>{
  const S=shell(root,2,'Reproduction is the biological process of an organism(s) passing down genes to produce offspring.',`
  <div class="two">
    <div class="box"><h3>Sexual reproduction</h3><p><b>Two parents</b> pass down genes to produce <b>genetically unique</b> offspring.</p>
      <ul><li>Takes place in more complex organisms</li><li>Slower</li><li>Increases <b>genetic diversity</b></li></ul></div>
    <div class="box"><h3>Asexual reproduction</h3><p><b>One parent</b> produces <b>genetically identical</b> offspring.</p>
      <ul><li>Takes place in less complex organisms</li><li>Faster</li><li>Bacteria split in two through <b>binary fission</b>.</li><li>Hydra reproduce by <b>budding</b>.</li><li>Sea stars and some worms reproduce by <b>fragmentation</b>.</li></ul></div>
  </div>
  <p class="dyk" style="margin-top:12px"><b>Did you know?</b> Some plants and animals can reproduce both ways. Strawberry plants make seeds (sexual) and also send out runners that grow into identical new plants (asexual).</p>`);

  /* ---- Asexual tabs ---- */

  const dnaCoil=`<path d="M-14,0 c0,-10 8,-12 12,-6 s10,10 14,2 s-4,-12 -10,-6 s-10,12 -4,14 s14,-2 12,-8" fill="none" stroke="#F3D34A" stroke-width="3"/>`;
  Player($('#s2p0',tabs),{duration:12,
    svg:`<svg viewBox="0 0 640 220" role="img" aria-labelledby="s2b-t"><title id="s2b-t">Binary fission: a rod-shaped bacterium copies its circular DNA, stretches, pinches in the middle, and splits into two identical cells</title>

      <rect data-k="hL" x="190" y="80" width="130" height="70" rx="35" fill="#8E5CC2" stroke="#4A2475" stroke-width="3" style="opacity:0"/>
      <rect data-k="hR" x="320" y="80" width="130" height="70" rx="35" fill="#8E5CC2" stroke="#4A2475" stroke-width="3" style="opacity:0"/>
      <g data-k="dA" transform="translate(320 115)">${dnaCoil}</g><g data-k="dB" transform="translate(320 115)" style="opacity:0">${dnaCoil}</g>
      <text data-k="lab" x="320" y="196" text-anchor="middle" font-size="16" font-weight="700" class="svgink" style="opacity:0">2 identical offspring cells</text>
      <text x="20" y="30" font-size="14" class="svgmuted">yellow coil = circular DNA</text></svg>`,
    steps:[[0,'A bacterium has one loop of <b>circular DNA</b>.'],[2,'First, it <b>copies its DNA</b>.'],[4,'The cell <b>stretches longer</b>. The two DNA copies move apart.'],[6.5,'The middle <b>pinches in</b>…'],[8.5,'…and it splits into <b>two identical cells</b>. This is <b>binary fission</b>.']],
    render(t,P){const k=P.k,cp=ease(seg(t,2,4)),el=ease(seg(t,4,6.5)),pin=t>=6.5,sep=ease(seg(t,8.5,10.5));

      op(k('dB'),cp>0?1:0);const dx=lerp(0,65,el)+sep*40;tr(k('dA'),`translate(${320-dx*(cp>0?1:0)} 115)`);tr(k('dB'),`translate(${320+dx} 115)`);
      op(k('lab'),seg(t,10,10.6));}});

  Player($('#s2p1',tabs),{duration:12,autoplay:false,
    svg:`<svg viewBox="0 0 640 240" role="img" aria-labelledby="s2h-t"><title id="s2h-t">Budding: a hydra grows a bud on its side; the bud grows tentacles and breaks off as a new identical hydra</title>

      <rect width="640" height="240" fill="var(--sky)"/><rect y="212" width="640" height="28" fill="#C8B68A"/>
      <use href="#s2-hy" x="0" y="0" transform="translate(240 214)" fill="#66BB6A" stroke="#2E7D32"/>
      <g data-k="bud"><use href="#s2-hy" fill="#66BB6A" stroke="#2E7D32"/></g>
      <text data-k="lab" x="430" y="40" text-anchor="middle" font-size="16" font-weight="700" class="svgink" style="opacity:0">New hydra: identical to its parent</text></svg>`,

    render(t,P){const k=P.k,g=ease(seg(t,2,8)),d=ease(seg(t,8,10.5));
      const s=lerp(.05,.55,g),x=lerp(254,430,d),y=lerp(170,214,d),r=lerp(60,0,d);op(k('bud'),t>=2?1:0);
      tr(k('bud'),`translate(${x} ${y}) rotate(${r}) scale(${s})`);op(k('lab'),seg(t,10,10.6));}});

  const arm=`<path d="M0,-9 L66,-4 Q74,0 66,4 L0,9 Z"/><circle cx="30" cy="0" r="3" fill="#7A1F1F"/><circle cx="50" cy="0" r="2.5" fill="#7A1F1F"/>`;
  Player($('#s2p2',tabs),{duration:12,autoplay:false,
    svg:`<svg viewBox="0 0 640 240" role="img" aria-labelledby="s2f-t"><title id="s2f-t">Fragmentation: a sea star arm breaks off and regrows into a whole new sea star, while the parent regrows its lost arm</title>
      <rect width="640" height="240" fill="var(--sky)"/>
      <g transform="translate(190 120)" fill="#EF8F5A" stroke="#8C3A12" stroke-width="2">
        ${[1,2,3,4].map(a=>`<g transform="rotate(${a*72})">${arm}</g>`).join('')}<g data-k="re0"><g>${arm}</g></g><circle r="18"/><circle r="5" fill="#7A1F1F"/></g>
      <g data-k="piece" fill="#EF8F5A" stroke="#8C3A12" stroke-width="2"><g>${arm}</g></g>
      <g data-k="B" fill="#EF8F5A" stroke="#8C3A12" stroke-width="2" style="opacity:0">${[1,2,3,4].map(a=>`<g transform="rotate(${a*72})"><g data-k="b${a}">${arm}</g></g>`).join('')}<circle data-k="bd" r="18"/><circle r="5" fill="#7A1F1F"/></g>
      <text data-k="lab" x="320" y="225" text-anchor="middle" font-size="16" font-weight="700" class="svgink" style="opacity:0">Two identical sea stars</text></svg>`,
    steps:[[0,'A <b>sea star</b> has five arms.'],[2,'One arm <b>breaks off</b>.'],[4.5,'The broken arm starts to grow a new center and new arms.'],[6.5,'The parent regrows its lost arm, too.'],[9.5,'Now there are two whole sea stars with the same genes. This is <b>fragmentation</b>.']],
    render(t,P){const k=P.k,m=ease(seg(t,2,4)),gr=ease(seg(t,4.5,9));
      op(k('re0'),t<2?1:seg(t,6.5,7));tr(k('re0').firstElementChild,`scale(${t<2?1:ease(seg(t,6.5,9.5))})`);
      op(k('piece'),t>=2&&gr<.02?1:0);tr(k('piece'),`translate(${lerp(190,420,m)} 120)`);

      op(k('lab'),seg(t,10,10.6));},
    init(P){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=arm;P.k('B').insertBefore(g,P.k('B').firstChild);}});

  const shapes={sq:(c)=>`<rect x="-8" y="-8" width="16" height="16" fill="${c}" stroke="#222"/>`,tri:(c)=>`<path d="M0,-10 L10,8 L-10,8Z" fill="${c}" stroke="#222"/>`,ci:(c)=>`<circle r="9" fill="${c}" stroke="#222"/>`,di:(c)=>`<path d="M0,-10 L10,0 L0,10 L-10,0Z" fill="${c}" stroke="#222"/>`};
  const PA=[['sq','#2E7D32'],['tri','#81C784'],['ci','#00897B'],['di','#9E9D24']],PB=[['sq','#6A1B9A'],['tri','#D81B60'],['ci','#F48FB1'],['di','#B39DDB']];

    <g transform="translate(150 60)"><ellipse rx="56" ry="34" fill="#A5D6A7" stroke="#2E7D32" stroke-width="3"/><text y="-42" text-anchor="middle" font-size="15" font-weight="700" class="svgink">Parent 1</text>${PA.map((g,i)=>chip(g,-36+i*24,0,'pa'+i)).join('')}</g>

    [0,1,2,3].forEach(q=>{const src=q<2?PA[kd[q]]:PB[kd[q]];sx+=`<g data-k="m${j}_${q}" style="opacity:0">${shapes[src[0]](src[1])}</g>`;});});

  Player(S.see,{duration:12,autoplay:false,svg:sx,

        const el=k(`m${j}_${q}`);op(el,t>=2+j*1.2?1:0);tr(el,`translate(${lerp(sx0,ex,p)} ${lerp(sy0,ey,p)}) scale(${lerp(1,.8,p)})`);});
      op(k('kid'+j),seg(t,3.8+j*1.2,4.4+j*1.2));});}});

  /* ---- Population race ---- */
  const ex=S.explore;ex.append(h('<h3 class="sub">Population race</h3>'));
  const race=h(`<div class="card"><p>Press <b>Next generation</b> a few times. Then press <b>Environmental change!</b> and see which population survives.</p>

      <div><h3>Sexual (one pair)</h3><svg viewBox="0 0 300 200" role="img" aria-label="Sexual population" data-s style="background:var(--surface2);border-radius:10px;width:100%"></svg><p data-sc></p></div></div>
    <div class="row"><button class="btn primary" type="button" data-next>Next generation</button><button class="btn sun" type="button" data-env disabled>Environmental change!</button><button class="btn" type="button" data-reset>Start over</button></div>
    <p class="fb" aria-live="polite" data-msg></p><p class="hint">Gene patterns: ● purple circle, ▲ green triangle, ■ orange square, ◆ blue diamond.</p></div>`);

  const TY=[['ci','#8E5CC2','purple circle'],['tri','#43A047','green triangle'],['sq','#EF6C00','orange square'],['di','#1E88E5','blue diamond']];
  let A,Sx,gen,hit;
  const draw=(svg,list)=>{const n=list.length,show=Math.min(n,160),c=Math.ceil(Math.sqrt(show*1.5)),r=Math.ceil(show/c),cw=290/c,ch=190/Math.max(r,1),sz=Math.min(cw,ch)*.38;
    svg.innerHTML=list.slice(0,show).map((ty,i)=>{const x=10+cw*(i%c)+cw/2-5,y=8+ch*Math.floor(i/c)+ch/2-3,T=TY[ty],s=sz/9;return `<g transform="translate(${x} ${y}) scale(${s})">${shapes[T[0]](T[1])}</g>`;}).join('')+(n===0?'<text x="150" y="105" text-anchor="middle" font-size="18" font-weight="700" fill="var(--bad)">Population wiped out</text>':'');};
  const counts=l=>TY.map((T,i)=>l.filter(x=>x===i).length);
  const rr=()=>{draw($('[data-a]',race),A);draw($('[data-s]',race),Sx);
    $('[data-ac]',race).innerHTML=`Generation ${gen}: <b>${A.length}</b> organisms. Kinds of gene patterns: <b>${new Set(A).size}</b>`;

    $('[data-env]',race).disabled=gen<3||hit;$('[data-next]',race).disabled=gen>=7||hit&&!A.length&&false;};
  const reset=()=>{A=[0];Sx=[0,1];gen=0;hit=false;$('[data-msg]',race).textContent='';$('[data-msg]',race).className='fb';rr();};
  $('[data-next]',race).onclick=()=>{gen++;A=A.concat(A).slice(0,256);const n=Math.round(Sx.length*1.5)+ (Sx.length<3?1:0);

    else{const c=+b.dataset.c;if(atp<c)return say(false,`✗ Not enough ATP! <span>The organism can’t do this work until it makes more ATP.</span>`);atp-=c;jobs.add(a);say(true,`✓ Spent ${c} ATP. <span>${b.textContent.replace(/\s*\(.*\)/,'')} uses chemical reactions powered by ATP.</span>`);}

const giraffe=(x,y,neck,s,o=1)=>`<g opacity="${o}" transform="translate(${x} ${y}) scale(${s})"><path d="M-22,-30 v30 M-10,-30 v30 M12,-30 v30 M22,-30 v30" stroke="#B5791E" stroke-width="6" stroke-linecap="round"/><ellipse cx="0" cy="-40" rx="32" ry="15" fill="#E8B04A" stroke="#8A5A10" stroke-width="2"/><path d="M18,-48 L${26},${-48-neck} L${36},${-48-neck} L30,-44z" fill="#E8B04A" stroke="#8A5A10" stroke-width="2"/><ellipse cx="${38}" cy="${-52-neck}" rx="12" ry="7" fill="#E8B04A" stroke="#8A5A10" stroke-width="2"/><circle cx="-10" cy="-42" r="4" fill="#8A5A10"/><circle cx="8" cy="-36" r="4" fill="#8A5A10"/><circle cx="${28}" cy="${-48-neck*.5}" r="3" fill="#8A5A10"/></g>`;
BUILD[7]=root=>{
  const S=shell(root,7,'Living things evolve over long periods of time.',`
  <div class="two">
    <div class="box"><h3>Evolution</h3><p>Populations of living things undergo <b>evolution</b> when the <b>genetic makeup of a population</b> changes over a long period of time.</p></div>
    <div class="box"><h3>Adaptation</h3><p>In some cases of evolution, a <b>heritable trait</b>, such as darker fur color or a wider beak shape, lets organisms survive and reproduce better in a particular environment. This is an <b>adaptation</b>.</p></div>
    <div class="box"><h3>Natural selection</h3><p><b>Natural selection</b> is the process that occurs over many generations when a heritable trait provides a <b>fitness advantage</b> and becomes more common in a population. This makes the population better suited to its environment.</p></div>
  </div>`);

  /* ---- natural selection sim (centerpiece, placed first in See it) ---- */
  S.see.append(h('<h3 class="sub">Natural selection simulation: mice and a hungry hawk</h3>'));
  const ns=h(`<div class="card mice-wrap">
    <p>A few mice were born with a random <b>mutation</b> that makes their fur dark. A hawk hunts the mice it can see. Survivors have babies, and babies inherit their parents’ fur color. Switch the background and run generations.</p>
    <svg viewBox="0 0 640 300" role="img" aria-labelledby="s7n-t" data-field style="width:100%;display:block;border-radius:10px"><title id="s7n-t">A field of light and dark mice; a hawk catches the mice that stand out against the background</title>
      <defs><pattern id="s7sand" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#E9D9B0"/><circle cx="8" cy="10" r="2" fill="#D4C08C"/><circle cx="28" cy="30" r="2.5" fill="#D4C08C"/><circle cx="30" cy="8" r="1.5" fill="#C9B47E"/></pattern>
        <pattern id="s7lava" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#2C2320"/><path d="M0,20 L18,26 30,14 60,22 M10,60 L24,40 44,46 52,30" stroke="#4A3A33" stroke-width="2" fill="none"/></pattern>
        <pattern id="s7hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#3E3029"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8D7B70" stroke-width="2"/></pattern></defs>
      <rect data-bg width="640" height="300" fill="url(#s7sand)"/><g data-mice></g>
      <g data-hawk style="opacity:0"><path d="M0,0 C-20,-14 -44,-12 -60,-4 C-40,-4 -24,2 -10,8 L0,14 L10,8 C24,2 40,-4 60,-4 C44,-12 20,-14 0,0Z" fill="#5D4037" stroke="#2E1B12" stroke-width="2"/><circle cx="0" cy="4" r="5" fill="#8D6E63"/></g>
      <rect x="8" y="8" width="270" height="30" rx="6" fill="rgba(255,255,255,.88)"/><text data-gen x="18" y="29" font-size="16" font-weight="700" fill="#1C2B20"></text></svg>
    <div class="row" style="margin-top:10px"><button class="btn primary" type="button" data-run1>Run 1 generation</button><button class="btn" type="button" aria-pressed="false" data-auto>Auto-run</button><button class="btn" type="button" data-bgb>Switch to lava rock</button><button class="btn" type="button" data-nsr>Start over</button></div>
    <p aria-live="polite" data-nsmsg style="margin-top:8px"></p>
    <h3 style="margin-top:8px">Fur color in the population, by generation</h3>
    <div class="tablewrap"><svg viewBox="0 0 640 210" role="img" aria-label="Bar chart of percent dark and light fur per generation" data-chart style="width:100%;min-width:480px;background:var(--surface);border-radius:8px"></svg></div>
    <p class="hint">Bars: dark fur = dark with stripes (bottom), light fur = light (top).</p>
    <div class="dyk" style="margin-top:10px"><b>What to notice:</b><ul style="margin:.3em 0 0"><li>No mouse ever changes color during its life. The <b>population</b> changes, generation by generation.</li><li><b>Mutations are random.</b> New light or dark mice pop up by chance, whether they help or not.</li><li>The fur color that helps mice <b>survive and reproduce</b> on that background becomes more common. That is <b>natural selection</b>.</li></ul></div></div>`);
  S.see.append(ns);
  const field=$('[data-mice]',ns),hawk=$('[data-hawk]',ns);let mice,bg,gen,hist,busy=false,auto=false,mut=0,startPct=13;
  const rndPos=()=>[30+Math.random()*580,60+Math.random()*225];
  const placeMice=()=>{field.innerHTML=mice.map((m,i)=>`<g data-i="${i}" transform="translate(${m.x} ${m.y}) scale(${m.flip?-1:1} 1)">${mouseSVG(m.f)}</g>`).join('');};
  const pctDark=()=>Math.round(mice.filter(m=>m.f).length/mice.length*100);
  const chart=()=>{const c=$('[data-chart]',ns);let s=`<line x1="40" y1="10" x2="40" y2="170" stroke="var(--ink)"/><line x1="40" y1="170" x2="630" y2="170" stroke="var(--ink)"/>`;
    [0,50,100].forEach(v=>{const y=170-v*1.6;s+=`<text x="34" y="${y+4}" text-anchor="end" font-size="11" class="svgink">${v}%</text><line x1="40" x2="630" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 3"/>`;});
    const w=Math.min(36,580/Math.max(hist.length,1)-4);hist.forEach((d,i)=>{const x=46+i*(w+4),hd=d*1.6;s+=`<rect x="${x}" y="${170-hd}" width="${w}" height="${hd}" fill="url(#s7hatch)"/><rect x="${x}" y="10" width="${w}" height="${160-hd}" fill="#EADBB4" stroke="#8A7A55"/><text x="${x+w/2}" y="186" text-anchor="middle" font-size="10" class="svgink">${i}</text>`;});
    s+=`<text x="335" y="204" text-anchor="middle" font-size="11" class="svgink">generation</text>`;c.innerHTML=s;};
  const status=()=>{$('[data-gen]',ns).textContent=`Generation ${gen} · dark fur: ${pctDark()}%`;$('[data-bgb]',ns).textContent=bg?'Switch to sand':'Switch to lava rock';};
  const nsReset=()=>{bg=0;gen=0;mice=Array.from({length:30},(_,i)=>{const[x,y]=rndPos();return{f:i<4?1:0,x,y,flip:Math.random()<.5};});hist=[pctDark()];$('[data-bg]',ns).setAttribute('fill','url(#s7sand)');startPct=pctDark();placeMice();chart();status();
    $('[data-nsmsg]',ns).innerHTML='Generation 0: most mice have light fur. Try running a few generations on sand, then switch to lava rock.';};
  const tween=(ms,fn)=>new Promise(r=>{if(RM){fn(1);return r();}const t0=performance.now();const f=now=>{const p=clamp((now-t0)/ms,0,1);fn(p);p<1?requestAnimationFrame(f):r();};requestAnimationFrame(f);});
  const runGen=async()=>{if(busy)return;busy=true;$('[data-run1]',ns).disabled=true;
    const idx=mice.map((m,i)=>i),victims=[];const w=i=>mice[i].f===bg?1:5;
    while(victims.length<10){const pool=idx.filter(i=>!victims.includes(i)),tot=pool.reduce((a,i)=>a+w(i),0);let r=Math.random()*tot;for(const i of pool){r-=w(i);if(r<=0){victims.push(i);break;}}}
    op(hawk,1);let hx=-60,hy=30;
    for(const v of victims){const m=mice[v],sx=hx,sy=hy;await tween(260,p=>{hx=lerp(sx,m.x,ease(p));hy=lerp(sy,m.y-10,ease(p));tr(hawk,`translate(${hx} ${hy})`);});
      const g=field.querySelector(`[data-i="${v}"]`);if(g)g.style.opacity=0;}
    await tween(300,p=>tr(hawk,`translate(${lerp(hx,700,p)} ${lerp(hy,-40,p)})`));op(hawk,0);
    const surv=mice.filter((m,i)=>!victims.includes(i));mut=0;
    await tween(350,p=>field.style.opacity=1-p);
    mice=Array.from({length:30},()=>{const par=surv[Math.floor(Math.random()*surv.length)];let f=par.f;if(Math.random()<.04){f=1-f;mut++;}const[x,y]=rndPos();return{f,x,y,flip:Math.random()<.5};});
    gen++;hist.push(pctDark());if(hist.length>20)hist.shift();placeMice();chart();status();Store.put('s7',{gen,dark:pctDark(),bg:bg?'lava rock':'sand',start:startPct});
    await tween(350,p=>field.style.opacity=p);
    $('[data-nsmsg]',ns).innerHTML=`Generation ${gen}: the hawk caught 10 mice (it spots mice that stand out on ${bg?'dark lava rock':'light sand'} more easily). The 20 survivors had 30 babies. Random mutations this generation: <b>${mut}</b>.`;
    if(gen>=6)Store.act('s7-sim');busy=false;$('[data-run1]',ns).disabled=false;if(auto&&gen<60)setTimeout(runGen,RM?600:250);};
  $('[data-run1]',ns).onclick=runGen;
  $('[data-auto]',ns).onclick=e=>{auto=!auto;e.currentTarget.setAttribute('aria-pressed',auto);if(auto)runGen();};
  $('[data-bgb]',ns).onclick=()=>{bg=1-bg;$('[data-bg]',ns).setAttribute('fill',bg?'url(#s7lava)':'url(#s7sand)');status();$('[data-nsmsg]',ns).innerHTML=`The background is now <b>${bg?'dark lava rock':'light sand'}</b>. No mouse changed color. Watch what happens to the population over the next generations.`;};
  $('[data-nsr]',ns).onclick=()=>{auto=false;$('[data-auto]',ns).setAttribute('aria-pressed',false);if(!busy)nsReset();};
  nsReset();

  /* ---- giraffe: lifetime vs generations ---- */
  S.see.append(h('<h3 class="sub">Does stretching change your babies? No.</h3>'));
  const necks=[38,52,66,80,94];
  Player(S.see,{duration:12,autoplay:false,
    svg:`<svg viewBox="0 0 640 300" role="img" aria-labelledby="s7g-t"><title id="s7g-t">Left: a giraffe stretching its neck during life does not pass a longer neck to its baby. Right: giraffes vary, longer-necked ones survive and pass on the trait over generations.</title>
      <rect width="640" height="300" fill="var(--sky)"/><rect y="270" width="640" height="30" fill="#C8B68A"/><line x1="320" y1="0" x2="320" y2="300" stroke="var(--line)" stroke-width="4"/>
      <text x="160" y="24" text-anchor="middle" font-size="15" font-weight="700" class="svgink">During one lifetime</text><text x="480" y="24" text-anchor="middle" font-size="15" font-weight="700" class="svgink">Over many generations</text>
      <path d="M560,60 q30,-20 60,0 q-10,30 -60,0z M380,90 q20,-14 44,0 q-8,22 -44,0z" fill="#66BB6A"/>
      <g data-k="L"></g><g data-k="R"></g>
      <g data-k="no" style="opacity:0"><circle cx="160" cy="70" r="26" fill="#B3261E"/><path d="M148,58 l24,24 M172,58 l-24,24" stroke="#fff" stroke-width="6"/><text x="160" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#B3261E">NOT how evolution works</text></g>
      <g data-k="yes" style="opacity:0"><circle cx="480" cy="140" r="24" fill="#1E7A38"/><path d="M468,140 l8,8 16,-17" stroke="#fff" stroke-width="5" fill="none"/></g>
      <text data-k="lt" x="160" y="292" text-anchor="middle" font-size="13" class="svgink"></text><text data-k="rt" x="480" y="292" text-anchor="middle" font-size="13" class="svgink"></text></svg>`,
    steps:[[0,'An old idea: a giraffe stretches its neck to reach leaves, and its neck gets longer during its life…'],[3,'…but its baby is still born with an ordinary neck. Changes during a lifetime are <b>not inherited</b>.'],[5,'❌ So this is <b>not</b> how evolution works. Individuals don’t evolve.'],
      [6,'What really happens: giraffes in a population already <b>vary</b>. Some have longer necks because of their genes.'],[8,'When food is scarce, giraffes that can reach high leaves survive and reproduce more. Short-neck giraffes leave fewer offspring.'],[9.5,'The survivors pass their genes on. Their babies <b>inherit</b> longer necks.'],[11,'✔ Over many generations, long necks become common in the <b>population</b>. That is natural selection.']],
    render(t,P){const k=P.k,st=ease(seg(t,.3,2.8));

    $$('[data-lv]',map).forEach(b=>b.onclick=()=>{curL=+b.dataset.lv;drawMap();drawStage();stage.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});});};
  const drawStage=()=>{const L=LV[curL],ii=L.items.findIndex((x,i)=>starsOf(`L${curL}-${i}`)===0);
    if(ii<0){const last=curL===LV.length-1||!LV[curL+1];stage.innerHTML=`<h3>Level ${curL+1} cleared! ★</h3><p>You earned ${L.items.reduce((a,x,i)=>a+starsOf(`L${curL}-${i}`),0)} of ${L.items.length*3} stars on ${L.name}.</p>
      ${ITEMS.every(x=>starsOf(x.id))?`<p><b>You reached the summit!</b> You used the characteristics of life to justify every decision.</p><a class="btn primary" href="#report">Go to my final report</a>`:curL<LV.length-1?`<button class="btn primary" type="button" data-nextlv>Climb to Level ${curL+2}</button>`:''}
      <details style="margin-top:10px"><summary>Review this level</summary><ul>${L.items.map((x,i)=>{const r=Store.d.alive[`L${curL}-${i}`];return `<li><b>${x.name}:</b> ${x.alive?'Alive':'Not alive'}. ${x.why}<br><i>Your justification:</i> ${(r.text||'').replace(/</g,'&lt;')}</li>`;}).join('')}</ul></details>`;
      const nb=$('[data-nextlv]',stage);if(nb)nb.onclick=()=>{curL++;drawMap();drawStage();};return;}
    const it=L.items[ii],id=`L${curL}-${ii}`,r=recOf(id);
    stage.innerHTML=`<p class="hint">Level ${curL+1} · ${L.name} · item ${ii+1} of ${L.items.length}</p><div class="itm"><span class="itm-ic" aria-hidden="true">${it.icon}</span><div><h3 style="margin:0">${it.name}</h3><p style="margin:0">${it.desc}</p></div></div><div data-step></div>`;

        $$('[data-v]',st).forEach(b=>b.onclick=()=>{const v=b.dataset.v==='1';r.verdict=v;r.tries++;

        $$('[data-e]',st).forEach(b=>b.onclick=()=>{const e=+b.dataset.e;if(e===0){r.ev=it.ev[0];r.step=2;sv();step();st.insertAdjacentHTML('afterbegin',fbx(true,'<span>That evidence uses the characteristics of life.</span>'));}
          else{r.miss++;sv();b.disabled=true;b.classList.add('bad');$('[data-f]',st).innerHTML=fbx(false,`Not the best evidence. <span>${it.evX[e]}</span>`);}});}
      else if(r.step===2){st.innerHTML=`<p class="qt"><b>Step 3.</b> Justify it in your own words. Say whether it is alive, and use <b>at least 2 characteristics of life</b> as evidence.</p>
          <label class="sr" for="jt-${id}">Your justification</label><textarea id="jt-${id}" rows="4" class="ta" placeholder="Example start: “I think it is … because …”">${(r.text||'').replace(/</g,'&lt;')}</textarea>
          <div class="row" style="margin-top:6px"><button class="btn primary" type="button" data-jc>Check my justification</button></div><div data-f></div>`;
        const ta=$('textarea',st);ta.oninput=()=>{r.text=ta.value;Store.quiet();};
        $('[data-jc]',st).onclick=()=>{const t=ta.value.trim(),low=t.toLowerCase(),words=t.split(/\s+/).filter(Boolean).length,found=CHARS.filter(c=>c[1].test(low)).map(c=>c[0]);r.text=t;
          const neg=/not alive|isn.?t alive|nonliving|non-living|not living|is dead|not a living/.test(low),f=$('[data-f]',st);
          if(words<12)f.innerHTML=fbx(false,`Too short (${words} word${words===1?'':'s'}). <span>Write at least 2 sentences, about 12 words or more.</span>`);
          else if(found.length<2)f.innerHTML=fbx(false,`Add more evidence. <span>${found.length?'I found: '+found.join(', ')+'. ':''}Use at least 2 characteristics of life, for example cells, DNA, energy, growth, reproduction, homeostasis, or response to stimuli.</span>`);
          else if(it.alive&&neg)f.innerHTML=fbx(false,`Check your conclusion. <span>Your writing says it isn’t alive, but you decided it is alive. Make your claim match your decision.</span>`);
          else{r.step=3;sv();toast(`+${Math.max(1,3-r.miss)} ★`);const ok=fbx(true,`Strong justification! <span>Evidence you used: ${found.join(', ')}. ${it.why}</span>`);
            if(lvlDone(curL)){toast(curL<LV.length-1?`Level up! Level ${curL+2} unlocked`:'Summit reached!');if(ITEMS.every(x=>starsOf(x.id))){Store.act('s9-alive');confetti();}}
            drawMap();stage.innerHTML=`<p class="hint">Level ${curL+1} · ${L.name}</p><div class="itm"><span class="itm-ic" aria-hidden="true">${it.icon}</span><h3 style="margin:0">${it.name}: ${it.alive?'Alive':'Not alive'} ${'★'.repeat(starsOf(id))}</h3></div>${ok}<button class="btn primary" type="button" data-nx>Next →</button>`;$('[data-nx]',stage).onclick=()=>drawStage();$('[data-nx]',stage).focus();return;}
          Store.save();};}};
    step();};
  const firstOpen=LV.findIndex((L,li)=>lvlOpen(li)&&!lvlDone(li));curL=firstOpen<0?LV.length-1:firstOpen;drawMap();drawStage();
};

const NOTES={
 1:{big:'Organisms grow and develop following specific instructions coded for by their genes.',
  key:['Growth: an increase in size and mass over time.','Growth is quantitative: it can be measured with numbers, like height or weight.','Development: the process where an organism transforms itself from a single cell into a more complex multicellular organism.','Development involves cell differentiation: cells with the same genes become specialized for different jobs (for example skin, muscle, and nerve cells).','Development is qualitative: it is described (new structures, functions, and abilities), not measured with numbers.'],
  saw:['Dragonfly life cycle: egg in water → aquatic nymph → the nymph molts several times, leaving its old exoskeleton behind → the final nymph climbs a reed → the adult emerges, its wings expand, and it flies.','Dragonfly growth: the nymph’s body length increases with each molt. You can measure it in millimeters.','Dragonfly development: it gains new structures (wing pads, wings, big adult eyes) and a new ability (flight).','Human growth: height and mass increase from baby to adult. Human development: milestones like walking, talking, losing baby teeth, and puberty.']},
 2:{big:'Reproduction is the biological process of an organism(s) passing down genes to produce offspring.',
  key:['Sexual reproduction: two parents pass down genes to produce genetically unique offspring. It happens in more complex organisms, is slower, and increases genetic diversity.','Asexual reproduction: one parent produces genetically identical offspring. It happens in less complex organisms and is faster.','Binary fission: a bacterium copies its DNA, stretches, pinches in the middle, and splits into two identical cells.','Budding: a new organism grows from a bud on the parent and breaks off (hydra).','Fragmentation: a piece breaks off and regrows into a whole organism (sea stars, some worms).','Both types pass down genes and produce offspring.'],
  saw:['Population race: the asexual population grew much faster, but every member was identical.','When a disease hit one gene pattern, the identical asexual population was wiped out. Some of the varied, sexually produced offspring survived.','Advantage of sexual reproduction: genetic diversity helps a population survive changes in the environment.']},
 3:{big:'Organisms are highly organized, coordinated structures that consist of one or more cells.',

  saw:['Zoom example: human (organism) → urinary system (organ system) → kidney (organ) → kidney tubule tissue → kidney cell → mitochondrion (organelle) → protein or DNA (macromolecule) → water (molecule) → oxygen (atom).','A paramecium’s one cell does every job of life. In a multicellular organism, specialized cells share the jobs.']},
 4:{big:'All living things contain DNA within their cells.',
  key:['DNA specifies the structure and function of living things.','DNA is the primary unit of heredity. Genes (made of DNA) are passed down to offspring during reproduction.','Universal genetic code: every organism’s DNA uses the same four nucleotide bases: adenine (A), thymine (T), guanine (G), and cytosine (C).','The shared genetic code supports the idea that all organisms evolved from a common ancestor long ago.','Base pairing: A pairs with T, and G pairs with C.','DNA diagram: cell → nucleus → chromosome → DNA helix → base pairs in the middle and a sugar-phosphate backbone on each side.'],
  saw:['All organisms use the same four bases. The order (sequence) of the bases is what makes organisms different, like a man and a mushroom.','Analogy: every English book uses the same 26 letters, but the order of the letters makes each book different.']},
 5:{big:'Homeostasis is the process of maintaining a stable internal condition despite changes in the external environment.',
  key:['Examples: sweating to cool the body; shivering to warm the body; maintaining pH; regulating blood sugar, water, and calcium levels.','The hypothalamus regulates temperature and osmotic pressure. Evaporation of water helps regulate body temperature.','The kidneys maintain water balance. The pancreas regulates blood sugar.','Blood distributes heat throughout the body. Skeletal muscle contracts and releases heat.','Blood glucose: glucose rises → pancreas releases insulin → body cells take up glucose → liver takes up glucose → glucose declines → homeostasis.','Negative feedback: stimulus → sensor (hypothalamus) → response (sweat or shiver) → back to the set point.'],
  saw:['More perspiration (sweating) → body temperature goes down, because evaporation carries heat away.','Higher heart rate → blood oxygen level goes up, because more oxygen-rich blood reaches the tissues.','Higher heart rate → blood pressure goes up.','Shivering → temperature goes up. Insulin → blood glucose goes down. Drinking water → water balance goes up.']},
 6:{big:'Living things must use energy and consume nutrients to carry out the chemical reactions that sustain life.',
  key:['Metabolism: the sum of the chemical reactions occurring in an organism.','Chemical reactions let organisms do work: moving and catching prey, growing and reproducing, transporting nutrients to cells and waste from cells, maintaining body structures, cellular respiration and photosynthesis.','Mitochondria are called the powerhouse of the cell. In eukaryotes, mitochondria produce ATP.','ATP is the energy currency for cells.','Mitochondrion parts: outer membrane (smooth outer layer), inner membrane (folded), intermembrane space (between the membranes), matrix (inside the inner membrane).'],
  saw:['Food → glucose → bloodstream → cell → mitochondrion. With oxygen, the mitochondrion makes ATP and gives off CO₂ and water.','ATP is spent on work, like a muscle contracting, a cell dividing, or a pump moving molecules.','Energy budget: with no ATP, an organism can’t do any work. Metabolism is all of these reactions together.']},
 7:{big:'Living things evolve over long periods of time.',

 8:'Describe your reaction-time test using the words stimulus and response. Then explain why a reflex is faster than your reaction time.'};
const FR2='What is one thing you learned at this station, and one question you still have?';
const VOCAB={1:['growth','development','quantitative','qualitative','differentiation','genes'],2:['genetic diversity','asexual','sexual','offspring','genes','identical'],3:['cell','tissue','organ','organ system','organism','multicellular'],4:['DNA','bases','sequence','common ancestor','genetic code','order'],
 5:['homeostasis','stable','temperature','hypothalamus','evaporation','heart rate'],6:['ATP','energy','metabolism','mitochondria','cellular respiration','chemical reactions'],7:['population','natural selection','generations','mutation','inherit','survive'],8:['stimulus','response','reflex','brain','spinal cord','neuron']};
const QCID={1:'s1-quiz',2:'s2-quiz',3:'s3-quiz',4:'s4-quiz',5:'s5-quiz',6:'s6-quiz',7:'s7-match',8:'s8-quiz'};
function wireFR(W,n){$$('[data-fr]',W).forEach(box=>{const key=box.dataset.fr,ta=$('textarea',box),fb=$('.frfb',box);ta.value=Store.d.fr[key]||'';
  const upd=()=>{const t=ta.value.trim(),w=t?t.split(/\s+/).length:0,low=t.toLowerCase();Store.d.fr[key]=ta.value;Store.quiet();
    if(!w){fb.innerHTML='<span class="hint">Your answer is saved as you type.</span>';return;}
    const used=VOCAB[n].filter(v=>low.includes(v.toLowerCase())),not=VOCAB[n].filter(v=>!used.includes(v)).slice(0,3);
    const len=w<20?`✎ ${w} word${w===1?'':'s'}. Aim for at least 2–3 complete sentences (about 20+ words).`:`✓ ${w} words. Saved.`;
    fb.innerHTML=`<b>${len}</b>`+(key.endsWith('a')?`<br>${used.length?`Station words you used: <b>${used.join(', ')}</b>. `:''}${not.length?`Try also using: ${not.join(', ')}.`:'You used all the key words!'}`:'');
    if(key.endsWith('a')&&w>=20&&used.length>=1)Store.act(`s${n}-write`);};
  ta.addEventListener('input',upd);upd();});}

      [4,'Zoom cell → nucleus → chromosome → helix → base pairs/backbone; spinning helix; base-pair builder; same bases, different order; 6-part label practice.'],

  $('[data-resetp]',v).onclick=()=>{if(confirm('Reset all of your progress and written answers on this device?')){Store.reset();toast('Progress reset');location.reload();}};

window.renderHubTiles=()=>{const T=$('[data-tiles]');if(!T)return;
