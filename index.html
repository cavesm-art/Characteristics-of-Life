function reportBlocks(name,period){const B=[],P=(t,x)=>B.push({t,x});const D=Store.d;
  P('title','Characteristics of Life: Final Report');P('meta',`Name: ${name||'________________________'}    Class/period: ${period||'________'}`);P('meta',`Generated: ${new Date().toLocaleString()}`);
  P('meta',`Stations visited: ${Object.keys(D.visited).length} of 9. Written answers: ${Object.values(D.fr).filter(x=>x&&x.trim()).length} of 16. Challenge stars: ${ITEMS.reduce((a,x)=>a+starsOf(x.id),0)} of ${ITEMS.length*3}.`);
  P('h1','Part 1: Note Guide (Stations 1–8)');
  for(let n=1;n<=8;n++){const N=NOTES[n],st=ST[n];P('h2',`Station ${n}: ${st.title}`);P('p',`Big idea: ${N.big}`);P('h3','Key notes');N.key.forEach(k=>P('li',k));P('h3','What the interactives showed');N.saw.forEach(k=>P('li',k));
    const dat=[];if(n===5&&D.data.s5)dat.push(`My best time in balance in the simulator: ${Math.floor(D.data.s5/60)}:${String(D.data.s5%60).padStart(2,'0')}`);
    if(n===7&&D.data.s7)dat.push(`My simulation: after ${D.data.s7.gen} generations (last background: ${D.data.s7.bg}), dark fur went from ${D.data.s7.start}% to ${D.data.s7.dark}% of the population.`);
    if(n===8&&D.data.s8)dat.push(`My reaction times: ${D.data.s8.trials.join(', ')} ms. My average reaction time: ${D.data.s8.avg} ms.`);
    const q=D.qc[QCID[n]];dat.push(q?`Quick check: ${q.r} of ${q.n} correct on the first try${q.a<q.n?` (${q.a} of ${q.n} attempted)`:''}.`:'Quick check: not attempted.');
    const acts=Object.keys(st.acts).filter(a=>D.acts[a]).map(a=>st.acts[a]);dat.push(`Activities finished: ${acts.length?acts.join(', '):'none yet'}.`);
    P('h3','My data');dat.forEach(x=>P('li',x));
    P('h3','My thinking');P('q',FR[n]);P('a',(D.fr[`s${n}a`]||'').trim()||'(not answered)');P('q',FR2);P('a',(D.fr[`s${n}b`]||'').trim()||'(not answered)');}
  P('h1','Part 2: Final Challenge – Is It Alive?');
  P('p',`Stars earned: ${ITEMS.reduce((a,x)=>a+starsOf(x.id),0)} of ${ITEMS.length*3}. Levels cleared: ${LV.filter((L,li)=>lvlDone(li)).length} of ${LV.length}.`);
  LV.forEach((L,li)=>{P('h2',`Level ${li+1}: ${L.name} (${L.diff})`);L.items.forEach((it,ii)=>{const r=D.alive[`L${li}-${ii}`];P('h3',it.name);
    if(!r||r.step<3){P('p',r&&r.step>0?'Started but not finished.':'Not attempted.');if(r&&r.text)P('a',r.text);return;}
    P('li',`My decision: ${r.verdict?'Alive':'Not alive'}. Correct answer: ${it.alive?'Alive':'Not alive'}.`);P('li',`Mistakes before getting it right: ${r.miss}. Stars: ${starsOf(`L${li}-${ii}`)} of 3.`);P('li',`Best evidence I chose: ${r.ev}`);P('q','My justification:');P('a',r.text||'');});});
  return B;}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const blocksHTML=B=>B.map(b=>({title:`<h2>${esc(b.x)}</h2>`,meta:`<p class="hint">${esc(b.x)}</p>`,h1:`<h2 style="margin-top:22px;color:var(--leaf-strong)">${esc(b.x)}</h2>`,h2:`<h3 style="margin-top:16px">${esc(b.x)}</h3>`,h3:`<p style="margin:10px 0 2px"><b>${esc(b.x)}</b></p>`,p:`<p>${esc(b.x)}</p>`,li:`<p style="margin:0 0 4px 16px">• ${esc(b.x)}</p>`,q:`<p style="margin:8px 0 2px"><i>${esc(b.x)}</i></p>`,a:`<p style="margin:0 0 8px;padding:6px 10px;border-left:4px solid var(--leaf);background:var(--surface2);white-space:pre-wrap">${esc(b.x)}</p>`})[b.t]).join('');
const pdfClean=s=>String(s).replace(/→/g,'->').replace(/←/g,'<-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/₂/g,'2').replace(/≈/g,'~').replace(/×/g,'x').replace(/µ/g,'u').replace(/★/g,'*').replace(/✓/g,'').replace(/·/g,'-').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g,'');
function makePDF(B){const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'letter'}),M=54,PW=612,PH=792,W=PW-2*M;let y=M;
  const S={title:[20,'bold',8],meta:[10,'normal',2],h1:[16,'bold',8],h2:[13,'bold',6],h3:[11,'bold',3],p:[10.5,'normal',4],li:[10.5,'normal',2],q:[10.5,'italic',2],a:[10.5,'normal',8]};
  B.forEach(b=>{const [fs,st,gap]=S[b.t],lh=fs*1.35,ind=b.t==='li'?14:b.t==='a'?12:0;
    if(b.t==='h1'){if(/^Part 2/.test(b.x)){doc.addPage();y=M;}else y+=10;}
    if(b.t==='h2'||b.t==='h3'){if(y+lh*3>PH-M){doc.addPage();y=M;}y+=b.t==='h2'?8:4;}
    doc.setFont('helvetica',st);doc.setFontSize(fs);doc.setTextColor(b.t==='h1'||b.t==='title'?'#1F5E24':b.t==='meta'?'#4A5E50':'#1C2B20');
    const txt=(b.t==='li'?'- ':'')+pdfClean(b.x),lines=b.t==='a'?pdfClean(b.x).split('\n').flatMap(l=>doc.splitTextToSize(l||' ',W-ind-6)):doc.splitTextToSize(txt,W-ind);
    lines.forEach(l=>{if(y+lh>PH-M){doc.addPage();y=M;doc.setFont('helvetica',st);doc.setFontSize(fs);}if(b.t==='a'){doc.setDrawColor('#2E7D32');doc.setLineWidth(2);doc.line(M+4,y+2,M+4,y+lh);}doc.text(l,M+ind,y+fs);y+=lh;});
    if(b.t==='h1'){doc.setDrawColor('#2E7D32');doc.setLineWidth(1.5);doc.line(M,y+2,M+W,y+2);}y+=gap;});
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor('#4A5E50');doc.text(`Characteristics of Life - Final Report - page ${i} of ${n}`,PW/2,PH-28,{align:'center'});}
  return doc.output('blob');}
function buildReport(v){
  v.appendChild(h(`<div class="wrap"><header class="st-head"><span class="badge" aria-hidden="true">✎</span><h1 tabindex="-1">My Final Report</h1><span class="tag">One PDF to turn in</span></header>
    <p class="bigidea">Download one file with Part 1 (your note guide for Stations 1–8, with your written answers) and Part 2 (your Is It Alive? challenge).</p>
    <section class="card"><h2>Before you download</h2>
      <div class="two"><div class="ctl"><label for="rpName">Your name</label><input id="rpName" class="inp" autocomplete="off"></div><div class="ctl"><label for="rpPer">Class period</label><input id="rpPer" class="inp" autocomplete="off"></div></div>
      <p class="hint">Your name is only put into the downloaded file. It is not saved anywhere.</p><ul data-check></ul>
      <div class="row"><button class="btn primary" type="button" data-dl>Download my report (PDF)</button></div><p class="fb" aria-live="polite" data-dlmsg></p></section>
    <details class="card" data-prevd><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700">Preview my report</summary><div data-prev></div></details></div>`));
  const chk=()=>{const D=Store.d,missing=[];for(let n=1;n<=8;n++){['a','b'].forEach(k=>{if(!(D.fr[`s${n}${k}`]||'').trim())missing.push(`Station ${n}${k==='a'?' free response':' reflection'}`);});}
    const cleared=ITEMS.filter(x=>starsOf(x.id)).length;
    $('[data-check]',v).innerHTML=`<li>${missing.length?`✗ Written answers still blank: ${missing.length} of 16 <span class="hint">(${missing.slice(0,4).join(', ')}${missing.length>4?', …':''})</span>`:'✓ All 16 written answers are filled in.'}</li><li>${cleared===ITEMS.length?'✓':'✗'} Is It Alive? challenge: ${cleared} of ${ITEMS.length} items cleared.</li><li class="hint">You can download at any time. Blank parts show as “not answered.”</li>`;
    $('[data-prev]',v).innerHTML=blocksHTML(reportBlocks($('#rpName').value.trim(),$('#rpPer').value.trim()));};
  v._refresh=chk;$('[data-prevd]',v).addEventListener('toggle',chk);
  $('[data-dl]',v).onclick=async()=>{const m=$('[data-dlmsg]',v),say=(ok,t)=>{m.className='fb '+(ok?'ok':'bad');m.innerHTML=t;};
    if(!window.jspdf){say(false,'The PDF tool didn’t load. <span>Check your internet connection and reload the page.</span>');return;}
    const name=$('#rpName').value.trim(),per=$('#rpPer').value.trim();let blob;
    try{blob=makePDF(reportBlocks(name,per));}catch(e){say(false,'Something went wrong building the PDF. <span>'+esc(e.message)+'</span>');return;}
    const slug=name.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
    const fname=`characteristics-of-life-report${slug?'-'+slug:''}.pdf`;
    /* Standard browser download: works when the page is opened from a file, a school website, Google Sites, Canvas, etc. */
    const browserSave=()=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fname;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();
      setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},60000);
      return url;};
    /* Only used if the page happens to be hosted on claude.ai, where plain downloads are blocked. */
    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){dl=null;}
    if(dl){try{await dl.save({filename:fname,data:blob});say(true,'Saved! <span>Upload this PDF to Canvas.</span>');return;}
      catch(e){if(e&&e.code==='declined'){say(false,'Download canceled. <span>Press the button again when you’re ready.</span>');return;}}}
    try{const url=browserSave();
      say(true,`Your PDF is downloading as <b>${esc(fname)}</b>. <span>Look in your Downloads folder, then upload it to Canvas. Nothing downloaded? <a href="${url}" target="_blank" rel="noopener">Open the PDF</a> and save it from there.</span>`);}
    catch(e){say(false,'The file couldn’t be saved here. <span>Try opening this page in its own browser tab, then press the button again.</span>');}};
}

/* =========================================================
   GLOSSARY DRAWER
   ========================================================= */
const GLOSS=[[1,'Growth','An increase in size and mass over time. Quantitative.'],[1,'Development','Changing from a single cell into a more complex organism with new structures and abilities. Qualitative.'],[1,'Quantitative','Can be measured with numbers.'],[1,'Qualitative','Described with words, not numbers.'],[1,'Cell differentiation','When cells become specialized for different jobs.'],[1,'Genes','Sections of DNA that hold instructions passed to offspring.'],
 [2,'Reproduction','An organism passing down genes to produce offspring.'],[2,'Sexual reproduction','Two parents pass down genes; offspring are genetically unique.'],[2,'Asexual reproduction','One parent makes genetically identical offspring.'],[2,'Genetic diversity','Variety of genes in a population.'],[2,'Binary fission','A cell copies its DNA and splits in two.'],[2,'Budding','A new organism grows as a bud on the parent and breaks off.'],[2,'Fragmentation','A piece breaks off and regrows into a whole organism.'],
 [3,'Unicellular','Made of one cell.'],[3,'Multicellular','Made of more than one cell.'],[3,'Organelle','A tiny structure inside a cell with a job.'],[3,'Tissue','A group of similar cells working together.'],[3,'Organ','Different tissues working together as one structure.'],[3,'Organ system','Organs working together.'],[3,'Macromolecule','A very large molecule, like a protein or DNA.'],
 [4,'DNA','Molecule that holds genetic instructions for traits and cell activities.'],[4,'Heredity','Passing traits from parents to offspring.'],[4,'Nucleotide bases','A, T, G, and C: the four “letters” of DNA.'],[4,'Universal genetic code','All organisms use the same four DNA bases.'],[4,'Common ancestor','An ancient organism that later groups descended from.'],[4,'Chromosome','A tightly wound package of DNA.'],[4,'Base pairs','A pairs with T; G pairs with C.'],[4,'Sugar-phosphate backbone','The sides of the DNA ladder.'],
 [5,'Homeostasis','Keeping a stable internal condition despite outside changes.'],[5,'Hypothalamus','Brain part that regulates temperature and water balance.'],[5,'Insulin','Hormone from the pancreas that lowers blood glucose.'],[5,'Negative feedback','A response that reverses a change and returns to normal.'],
 [6,'Metabolism','The sum of all chemical reactions in an organism.'],[6,'ATP','The energy currency of cells.'],[6,'Mitochondria','Organelles that make ATP; the powerhouse of the cell.'],[6,'Cellular respiration','Using glucose and oxygen to make ATP.'],[6,'Matrix','Space inside a mitochondrion’s inner membrane.'],[6,'Intermembrane space','Space between a mitochondrion’s two membranes.'],
 [7,'Evolution','Change in the genetic makeup of a population over a long time.'],[7,'Adaptation','A heritable trait that helps an organism survive and reproduce in its environment.'],[7,'Natural selection','A helpful heritable trait becomes more common over many generations.'],[7,'Fitness','How well an organism survives and reproduces.'],[7,'Mutation','A random change in DNA.'],[7,'Heritable trait','A trait that can be passed to offspring through genes.'],
 [8,'Stimulus','An event or condition that initiates a response.'],[8,'Response','An organism’s reaction to a stimulus.'],[8,'Reflex arc','A fast, involuntary nerve pathway through the spinal cord.'],[8,'Sensory neuron','Carries signals from the senses to the spinal cord or brain.'],[8,'Motor neuron','Carries signals to muscles.'],[8,'Effector','The organ (often a muscle) that carries out a response.']];
function renderGloss(q=''){q=q.toLowerCase();$('#gloList').innerHTML=GLOSS.filter(g=>!q||(g[1]+' '+g[2]).toLowerCase().includes(q)).sort((a,b)=>a[1].localeCompare(b[1])).map(g=>`<div class="gl-item">${ICON[g[0]]}<div><b>${g[1]}</b><br><span>${g[2]}</span> <a href="#s${g[0]}" class="hint">Station ${g[0]}</a></div></div>`).join('')||'<p>No matching words. Try a shorter search.</p>';}
const openGloss=o=>{$('#drawer').hidden=!o;$('#scrim').hidden=!o;$('#gloBtn').setAttribute('aria-expanded',o);if(o)$('#gloQ').focus();else $('#gloBtn').focus();};
$('#gloBtn').onclick=()=>openGloss($('#drawer').hidden);$('#gloClose').onclick=()=>openGloss(false);$('#scrim').onclick=()=>openGloss(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden)openGloss(false);});
$('#gloQ').oninput=e=>renderGloss(e.target.value);$('#gloList').addEventListener('click',e=>{if(e.target.closest('a'))openGloss(false);});renderGloss();

/* =========================================================

   ========================================================= */
const main=$('#main'),VIEWS={};
function route(){let id=(location.hash||'#hub').slice(1);if(!/^(hub|report|s[1-9])$/.test(id))id='hub';
  if(!VIEWS[id]){const v=h(`<div data-view="${id}"></div>`);main.appendChild(v);VIEWS[id]=v;

  Object.entries(VIEWS).forEach(([k,v])=>v.hidden=k!==id);
  if(/^s/.test(id))Store.visit(+id.slice(1));if(id==='report'&&VIEWS.report._refresh)VIEWS.report._refresh();refreshProgressUI();window.scrollTo(0,0);
  const t=VIEWS[id].querySelector('h1');if(t){t.tabIndex=-1;t.focus({preventScroll:true});}
  document.title=id==='hub'?'Characteristics of Life':id==='report'?'My Final Report':`Station ${id.slice(1)} · ${ST[+id.slice(1)].title}`;}
Store.load();window.addEventListener('hashchange',route);route();
